<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Обратная связь</title>
<style>
  body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 40px; }
  .form { max-width: 420px; margin: 0 auto; background: #fff; padding: 24px; border: 1px solid #ddd; }
  label { display: block; margin: 12px 0 4px; font-size: 14px; }
  input, textarea { width: 100%; padding: 8px; border: 1px solid #bbb; font-size: 14px; box-sizing: border-box; }
  .send-btn { margin-top: 16px; width: 140px; height: 36px; background: #2b5797; color: #fff; border: 0;
              font-size: 14px; padding-top: 18px; line-height: 36px; text-align: left; cursor: pointer; }
</style>
</head>
<body>
  <form class="form">
    <label for="name">Имя</label>
    <input id="name" type="text">
    <label for="msg">Сообщение</label>
    <textarea id="msg" rows="5"></textarea>
    <button class="send-btn" type="submit">Отправить</button>
  </form>
</body>
</html>
